<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Món Ăn - Food Management System</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    body { background-color: #f8f9fa; }
    .food-card { transition: transform 0.2s; }
    .food-card:hover { transform: translateY(-5px); }
  </style>
</head>
<body>

  <div class="container py-4">
    <h2 class="text-center text-primary mb-4 fw-bold">
      <i class="bi bi-egg-fried"></i> HỆ THỐNG QUẢN LÝ MÓN ĂN
    </h2>

    <!-- Vùng thông báo Alert -->
    <div id="alertContainer"></div>

    <!-- Thanh tìm kiếm & Nút thêm món -->
    <div class="row g-3 mb-4">
      <div class="col-md-8">
        <div class="input-group">
          <input type="text" id="searchInput" class="form-control" placeholder="Tìm kiếm theo tên món, loại món hoặc vùng miền...">
          <button class="btn btn-outline-primary" id="btnSearch" onclick="handleSearch()">
            <i class="bi bi-search"></i> Tìm kiếm
          </button>
        </div>
      </div>
      <div class="col-md-4 text-end">
        <button class="btn btn-success w-100" data-bs-toggle="modal" data-bs-target="#foodModal" onclick="openAddModal()">
          <i class="bi bi-plus-circle"></i> Thêm món ăn mới
        </button>
      </div>
    </div>

    <!-- Trạng thái Loading -->
    <div id="loadingSpinner" class="text-center my-5 d-none">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Đang tải...</span>
      </div>
      <p class="mt-2 text-muted">Đang tải dữ liệu món ăn...</p>
    </div>

    <!-- Màn hình danh sách món ăn dạng Bảng -->
    <div class="card shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-primary">
              <tr>
                <th>Mã món (foodId)</th>
                <th>Tên món ăn</th>
                <th>Loại món</th>
                <th>Vùng miền</th>
                <th>Giá (VNĐ)</th>
                <th>Số lượng</th>
                <th class="text-center">Thao tác</th>
              </tr>
            </thead>
            <tbody id="foodTableBody">
              <!-- Dữ liệu được tải động từ JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: THÊM / CẬP NHẬT MÓN ĂN -->
  <div class="modal fade" id="foodModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title" id="foodModalTitle">Thêm món ăn</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="foodForm">
            <input type="hidden" id="mongoId">
            <div class="mb-3">
              <label class="form-label">Mã món ăn (foodId) <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="foodId" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Tên món ăn <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="foodName" required>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Loại món <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="foodCategory" placeholder="Món chính, Tráng miệng..." required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Vùng miền <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="foodCuisine" placeholder="Miền Bắc, Miền Nam..." required>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Giá bán (VNĐ) <span class="text-danger">*</span></label>
                <input type="number" class="form-control" id="foodPrice" min="0" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Số lượng <span class="text-danger">*</span></label>
                <input type="number" class="form-control" id="foodQuantity" min="0" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Thành phần (Phân cách bằng dấu phẩy)</label>
              <input type="text" class="form-control" id="foodIngredients" placeholder="Bánh phở, Bò tái, Hành lá...">
            </div>
            <div class="mb-3">
              <label class="form-label">Mô tả</label>
              <textarea class="form-control" id="foodDescription" rows="2"></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button type="button" class="btn btn-primary" onclick="saveFood()">Lưu lại</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: XEM CHI TIẾT MÓN ĂN -->
  <div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-info text-white">
          <h5 class="modal-title">Chi Tiết Món Ăn</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="detailModalContent">
          <!-- Nội dung chi tiết hiển thị từ JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Link tệp cấu hình và JS chính -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
